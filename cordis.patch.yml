# Слой патча пакета «Сторож TODO».
#
# Одна строка: сторож сам дописывает `todo/write` в живые сессии, чтобы плашка
# задач над полем ввода всегда была создана и актуальна. Имя строки — имя
# пакета; подпути DSH как отдельные строки не грузятся в клиентскую таблицу.
#
# Параметры меняются здесь или в профиле пользователя.
- insert:
    - id: todo-watch
      name: '@local/dsh-todo-watch'
      config:
        checkIntervalSeconds: 30
        staleAfterMinutes: 10
        curator: llm
        llmMinIntervalSeconds: 60
        llmTimeoutMs: 20000
        llmMaxOutputTokens: 400
        maxItems: 7
        allowParallelInProgress: true
        promoteCompletedOnTurnEnd: true
        includeSubagents: false
